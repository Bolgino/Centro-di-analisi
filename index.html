<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centro di Analisi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: un terminale di laboratorio segreto, teatrale ma chiarissimo da leggere a due metri.
   IDEA: la consolle del Centro di Analisi, come l'invito "classified".
   PICTURE: la consolle stessa: tabellone in alto, la consegna guidata a pulsanti grandi.
   COLOUR and TYPE: antracite, oro, rosso timbro; Special Elite per i titoli, Inter per il resto.
   LAYOUT: una colonna larga; tabellone a 4 tessere, poi il passo corrente della consegna. */
:root{color-scheme:dark;--bg:#14161a;--panel:#1c1f25;--line:#3a3628;--gold:#b9a77a;--ink:#ece7da;--dim:#9a9484;--red:#c0392b;--ok:#3f9a62;--warn:#d39b2a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
.band{background:#b3261e;color:#fff;text-align:center;font-weight:800;letter-spacing:.6em;padding:8px 0;font-size:14px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px max(4vw,16px) 6px}
h1{font-family:"Special Elite",monospace;font-weight:400;font-size:clamp(28px,4vw,44px);margin:0;line-height:1.05}
h2{font-family:"Special Elite",monospace;font-weight:400;font-size:26px;margin:0 0 12px}
.sub{color:var(--gold);font-size:14px}
nav{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;min-height:48px;padding:10px 16px;cursor:pointer}
button:hover{border-color:var(--gold)}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.3;cursor:not-allowed}
.wrap{padding:8px max(4vw,16px) 40px;max-width:1240px;margin:0 auto}
.score{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:12px 0 22px}
.team{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}
.team .n{font-family:"Special Elite",monospace;font-size:24px}
.team .p{font-size:clamp(34px,5vw,56px);font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.team .s{color:var(--dim);font-size:13px}
.team.lead{border-color:var(--gold)}
.console{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:clamp(16px,3vw,28px)}
.grid{display:grid;gap:10px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.big{font-size:22px;font-weight:800;min-height:88px}
.pick.ev{font-family:"Special Elite",monospace;font-size:19px}
.seg{border-color:var(--ok)}.fon{border-color:var(--red)}
.pin{display:flex;gap:10px;justify-content:center;margin:8px 0 14px}
.pin span{width:46px;height:56px;border:1.5px solid var(--line);border-radius:10px;display:grid;place-items:center;font-size:28px}
.keys{max-width:360px;margin:0 auto}
.crumbs{color:var(--gold);margin-bottom:12px;font-size:15px}
.result{text-align:center;padding:12px 0}
.verdict{font-family:"Special Elite",monospace;font-size:clamp(34px,6vw,64px);line-height:1.05;margin:6px 0}
.pts{font-size:clamp(28px,4vw,44px);font-weight:800}
.todo{display:inline-block;margin-top:14px;padding:12px 16px;border:2px dashed var(--gold);border-radius:12px;font-size:19px}
.stamp{display:inline-block;border:5px solid var(--red);color:var(--red);font-family:"Special Elite",monospace;font-size:30px;padding:4px 16px;transform:rotate(-6deg)}
.feed{margin-top:22px}.feed li{color:var(--dim);margin:4px 0}
.note{color:var(--dim);font-size:14px}
.err{color:#ff8a7a}
table{border-collapse:collapse;width:100%;font-size:15px}td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
input{font:inherit;font-size:16px;background:#0f1114;color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:10px;min-height:44px;width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tv .score{grid-template-columns:repeat(2,minmax(0,1fr))}.tv .team .p{font-size:clamp(48px,9vw,120px)}
.hide{display:none!important}
@media(max-width:700px){.score,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(prefers-reduced-motion:no-preference){.result{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.96);opacity:0}}}
.hints{padding-left:18px}.hints li{margin:8px 0;font-size:17px}
#overlay{position:fixed;inset:0;background:rgba(10,11,14,.94);display:grid;place-content:center;text-align:center;padding:5vw;z-index:9}
#overlay .verdict{font-size:clamp(48px,8vw,110px)}#overlay .pts{font-size:clamp(40px,6vw,80px)}#overlay .crumbs{font-size:clamp(24px,3vw,40px)}
h3{margin:22px 0 8px}
</style>
</head>

const EVS=Object.keys(KEY);
const HINTS={"EV-01": ["Provate a leggerlo allo specchio.", "Si legge da destra a sinistra."], "EV-02": ["L'alfabeto è stato piegato a metà.", "La prima lettera diventa l'ultima, la seconda la penultima: A↔Z, B↔Y…"], "EV-03": ["Ogni lettera è stata spostata dello stesso numero di posti.", "La chiave dice in cosa si è trasformata la A: contate quanti posti e tornate indietro."], "EV-04": ["Sono numeri, scritti come li scrive un computer.", "Cinque cifre per lettera, che valgono 16, 8, 4, 2, 1. Il numero che esce è il posto della lettera nell'alfabeto (A=1)."], "EV-05": ["Ogni lettera ha il suo posto in fila.", "A=1, B=2 … Z=26."], "EV-06": ["Due cifre per lettera: riga e colonna di una griglia 5×5.", "La griglia comincia con la chiave, poi il resto dell'alfabeto. I e J stanno nella stessa casella."], "EV-07": ["Due sole lettere a gruppi di cinque: come uno 0 e un 1.", "A vale 0 e B vale 1, a gruppi di cinque. Si parte da zero: AAAAA è la A, AAAAB la B."], "EV-08": ["Ogni lettera è stata spostata dello stesso numero di posti.", "La chiave dice in cosa si è trasformata la A: contate quanti posti e tornate indietro."], "EV-09": ["La chiave si scrive sotto il messaggio, ripetuta. Usate la tabella delle lettere.", "Riga = lettera della chiave; cercate in quella riga la lettera cifrata; la colonna vi dà la lettera vera."], "EV-10": ["Pensate ai vecchi SMS.", "Il numero è il tasto, quante volte è ripetuto dice la lettera: 222 = C."], "EV-11": ["L'alfabeto è stato piegato a metà.", "La prima lettera diventa l'ultima, la seconda la penultima: A↔Z, B↔Y…"], "EV-12A": ["Sono numeri, scritti come li scrive un computer.", "Cinque cifre per lettera, che valgono 16, 8, 4, 2, 1. Il numero che esce è il posto della lettera nell'alfabeto (A=1)."], "EV-12B": ["Avete la tabella giusta sul Foglio dei codici.", "È Morse."], "EV-13A": ["Due sole lettere a gruppi di cinque: come uno 0 e un 1.", "A vale 0 e B vale 1, a gruppi di cinque. Si parte da zero: AAAAA è la A, AAAAB la B."], "EV-13B": ["Ogni lettera è stata spostata dello stesso numero di posti.", "La chiave dice in cosa si è trasformata la A: contate quanti posti e tornate indietro."], "EV-14": ["Le lettere sono quelle giuste, ma in disordine. Ogni gruppo è una colonna.", "Scrivete la chiave in orizzontale e mettete i gruppi sotto le sue lettere in ordine alfabetico; poi leggete per righe."], "EV-15": ["Due cifre per lettera: riga e colonna di una griglia 5×5.", "La griglia comincia con la chiave, poi il resto dell'alfabeto. I e J stanno nella stessa casella."], "EV-16": ["Avete la tabella giusta sul Foglio dei codici.", "È Morse."], "EV-17": ["La chiave si scrive sotto il messaggio, ripetuta. Usate la tabella delle lettere.", "Riga = lettera della chiave; cercate in quella riga la lettera cifrata; la colonna vi dà la lettera vera."], "EV-18": ["Le lettere sono quelle giuste, ma in disordine. Ogni gruppo è una colonna.", "Scrivete la chiave in orizzontale e mettete i gruppi sotto le sue lettere in ordine alfabetico; poi leggete per righe."], "EV-19": ["La chiave si scrive sotto il messaggio, ripetuta. Usate la tabella delle lettere.", "Riga = lettera della chiave; cercate in quella riga la lettera cifrata; la colonna vi dà la lettera vera."], "EV-20": ["Avete la tabella giusta sul Foglio dei codici.", "È Morse."], "EV-21": ["Come Vigenère, ma la tabella si usa al contrario.", "Colonna = lettera cifrata; cercate in quella colonna la lettera della chiave; la riga vi dà la lettera vera."], "EV-22": ["Pensate ai vecchi SMS.", "Il numero è il tasto, quante volte è ripetuto dice la lettera: 222 = C."], "EV-23": ["Sono numeri, scritti come li scrive un computer.", "Cinque cifre per lettera, che valgono 16, 8, 4, 2, 1. Il numero che esce è il posto della lettera nell'alfabeto (A=1)."], "EV-24": ["La chiave si scrive sotto il messaggio, ripetuta. Usate la tabella delle lettere.", "Riga = lettera della chiave; cercate in quella riga la lettera cifrata; la colonna vi dà la lettera vera."], "EV-25": ["Due cifre per lettera: riga e colonna di una griglia 5×5.", "La griglia comincia con la chiave, poi il resto dell'alfabeto. I e J stanno nella stessa casella."], "EV-26": ["Due sole lettere a gruppi di cinque: come uno 0 e un 1.", "A vale 0 e B vale 1, a gruppi di cinque. Si parte da zero: AAAAA è la A, AAAAB la B."], "EV-27": ["Ogni lettera è stata spostata dello stesso numero di posti.", "La chiave dice in cosa si è trasformata la A: contate quanti posti e tornate indietro."], "EV-28": ["Le lettere sono quelle giuste, ma in disordine. Ogni gruppo è una colonna.", "Scrivete la chiave in orizzontale e mettete i gruppi sotto le sue lettere in ordine alfabetico; poi leggete per righe."], "EV-29": ["Provate a leggerlo allo specchio.", "Si legge da destra a sinistra."], "SUPER": ["Griglia 5×5 con la chiave; le lettere vanno lette a coppie.", "Stessa riga: lettera a sinistra. Stessa colonna: lettera sopra. Altrimenti: angoli opposti del rettangolo."]};
const HEVS=Object.keys(HINTS);const baseEv=h=>h.replace(/[AB]$/,"");
const ans=(ev,k)=>{const a=KEY[ev];return k==="tpc"&&a[1]?a[1]:a[0]};


const CLIPS=[["team_SENSEI","Parla la collaborazione SENSEI."],["team_DAMIC","Parla la collaborazione DAMIC."],["team_XENON","Parla la collaborazione XENON."],["team_DarkSide","Parla la collaborazione DarkSide."],["segnale_ok","Confermato! Candidato materia oscura. Preparate il discorso per Stoccolma."],["fondo_ok","Corretto. È fondo, e avete trovato il colpevole."],["fondo_quasi","È fondo, sì. Ma il colpevole è un altro."],["errore","Respinto. Il revisore numero due è molto deluso da voi."],["super_attesa","Silenzio in sala. È arrivato il Super-evento."],["super_ok","Scoperta! Il Super-evento è materia oscura!"],["super_ko","Niente da fare. Il Super-evento vi ha ingannati."],["gia_risolto","Questo evento è già chiuso."],["gia_tentato","Questo evento vi ha già respinti. Lasciatelo andare."],["indizio","Ha chiesto un indizio. Un punto in meno."],["bonus","E siete i primi a risolverlo: un punto bonus!"]];
const fresh=()=>({teams:Object.fromEntries(TEAMS.map((t,i)=>[t.id,{pin:String(i+1).repeat(4),pts:4,seg:0,fon:0,err:0,ind:0}])),ev:Object.fromEntries(EVS.map(e=>[e,{solved:[],failed:[],first:null}])),log:[],hints:{},admin:"regia",gen:1});
const $=s=>document.querySelector(s),esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>(n>0?"+":"")+String(n).replace(".",",");
const num=n=>String(n).replace(".",",");
const r1=n=>Math.round(n*10)/10;
const view=()=>location.hash.slice(1);
let G=null,me=null;try{me=JSON.parse(localStorage.getItem("centro_me")||"null")}catch(e){}

/* ---------- archivio condiviso: Firebase, oppure prova locale ---------- */
const DEMO=!FIREBASE_CONFIG||!FIREBASE_CONFIG.projectId||new URLSearchParams(location.search).has("demo");
let store;
async function makeStore(){
  if(DEMO){
    const subs=[],asubs=[];const get=()=>{try{return JSON.parse(localStorage.getItem("demo_state"))}catch(e){return null}};
    const emit=()=>{const g=get();subs.forEach(f=>f(g))};
    addEventListener("storage",e=>{if(e.key==="demo_state")emit();if(e.key==="demo_ann"&&e.newValue){const a=JSON.parse(e.newValue);asubs.forEach(f=>f(a))}});
    return{demo:true,
      onState(f){subs.push(f);f(get())},
      async transact(fn){let g=get()||fresh();const r=fn(g);localStorage.setItem("demo_state",JSON.stringify(g));emit();return r},
      async set(g){localStorage.setItem("demo_state",JSON.stringify(g));emit()},
      async announce(a){a.ts=Date.now();localStorage.setItem("demo_ann",JSON.stringify(a));asubs.forEach(f=>f(a))},
      onAnnounce(f){asubs.push(f)}};
  }
  const V="10.12.2";
  const {initializeApp}=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const fs=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const db=fs.getFirestore(initializeApp(FIREBASE_CONFIG));const ref=fs.doc(db,"centro","partita");const col=fs.collection(db,"annunci");
  return{demo:false,
    onState(f){fs.onSnapshot(ref,s=>f(s.exists()?s.data():null),e=>setStatus("Archivio non raggiungibile: "+e.code))},
    transact(fn){return fs.runTransaction(db,async tx=>{const s=await tx.get(ref);const g=s.exists()?s.data():fresh();const r=fn(g);tx.set(ref,g);return r})},
    set(g){return fs.setDoc(ref,g)},
    announce(a){a.ts=Date.now();return fs.addDoc(col,a)},
    onAnnounce(f){const since=Date.now();fs.onSnapshot(fs.query(col,fs.where("ts",">",since),fs.orderBy("ts")),s=>s.docChanges().forEach(c=>{if(c.type==="added")f(c.doc.data())}))}};
}
function setStatus(t){const el=$("#status");if(el)el.textContent=t}
function fix(g){g.hints=g.hints||{};g.ev=g.ev||{};EVS.forEach(e=>{const s=g.ev[e]||(g.ev[e]={failed:[]});if(!s.solved){s.solved=s.by?[s.by]:[];s.first=s.by||null;delete s.by}s.failed=s.failed||[]});TEAMS.forEach(t=>{g.teams[t.id].ind=g.teams[t.id].ind||0});return g}

/* ---------- regole del gioco ---------- */
const STAY="Lasciate il foglietto dove l'avete trovato.";
const closed=(st,t,e)=>st.solved.includes(t)||(e==="SUPER"&&st.solved.length>0);
function judgeOn(g,t,pin,e,v,c){const T=g.teams[t];if(!T||T.pin!==pin)return{auth:1};
  const k=TEAMS.find(x=>x.id===t).k,st=g.ev[e],sup=e==="SUPER";let r;
  if(closed(st,t,e))r={txt:"già risolto",pts:0,clip:"gia_risolto",msg:sup?"Il Super-evento è già stato risolto da un'altra squadra.":"Questo evento l'avete già risolto.",todo:STAY};
  else if(st.failed.includes(t))r={txt:"già respinto",pts:0,clip:"gia_tentato",msg:"Avete già sbagliato questo evento.",todo:STAY};
  else{const a=ans(e,k);
    if(v!==a.s){r={txt:"sbagliato",pts:sup?-3:-2,clip:sup?"super_ko":"errore",msg:"Verdetto respinto.",bad:1};st.failed.push(t);T.err++}
    else{if(a.s==="S"){r={txt:"materia oscura, giusto",pts:sup?6:3,clip:sup?"super_ok":"segnale_ok",msg:"Candidato materia oscura confermato!"};T.seg++}
      else if(c===a.c){r={txt:"fondo, colpevole giusto",pts:2.5,clip:"fondo_ok",msg:"Fondo, colpevole giusto: "+a.c+"."};T.fon++}
      else{r={txt:"fondo, colpevole sbagliato",pts:2,clip:"fondo_quasi",msg:"Fondo sì, ma il colpevole è un altro."};T.fon++}
      st.solved.push(t);if(!st.first&&!sup){st.first=t;r.bonus=1;r.pts+=1;r.msg+=" Primi a risolverlo: +1 bonus!"}else if(!st.first)st.first=t}
    r.todo=STAY;T.pts=r1(T.pts+r.pts);g.log.push({t:Date.now(),team:t,ev:e,v,c:c||"",txt:r.txt+(r.bonus?" (primi)":""),pts:r.pts,bonus:r.bonus||0,ok:r.bad?0:1})}
  r.sup=sup;return r}
const lvl=(g,h,t)=>((g.hints[h]||{})[t]||0);
function hintOn(g,t,pin,h){const T=g.teams[t];if(!T||T.pin!==pin)return{auth:1};fix(g);
  const l=lvl(g,h,t)+1;if(closed(g.ev[baseEv(h)],t,baseEv(h)))return{no:"Questo evento è già chiuso per voi."};if(l>2)return{no:"Avete già ricevuto i due indizi di questo foglietto."};if(T.pts<1)return{no:"Non avete abbastanza punti."};
  g.hints[h]=g.hints[h]||{};g.hints[h][t]=l;T.pts=r1(T.pts-1);T.ind++;g.log.push({t:Date.now(),type:"hint",team:t,ev:h,txt:"indizio",pts:-1});return{l,text:HINTS[h][l-1]}}

/* ---------- tabellone ---------- */
function scoreHTML(){if(!G)return"";const max=Math.max(...TEAMS.map(t=>G.teams[t.id].pts));
  return TEAMS.map(t=>{const x=G.teams[t.id];return`<div class="team ${x.pts===max&&TEAMS.some(o=>G.teams[o.id].pts<max)?"lead":""}"><div class="n">${esc(t.id)}</div><div class="p">${esc(num(x.pts))}</div><div class="s">${x.seg} segnali · ${x.fon} fondi · ${x.err} errori · ${x.ind||0} indizi</div></div>`}).join("")}
function feedHTML(){return G&&G.log.length?G.log.slice(-12).reverse().map(l=>l.type==="hint"?`<li><b>${esc(l.team)}</b> · ha chiesto un indizio (−1)</li>`:`<li><b>${esc(l.team)}</b> · ${esc(l.ev)} · ${esc(l.txt)} (${esc(fmt(l.pts))})</li>`).join(""):"<li>Ancora nessuna consegna.</li>"}

/* ---------- voce (solo sullo schermo del Centro) ---------- */
let clips={};
function idb(){return new Promise((ok,ko)=>{const r=indexedDB.open("centro_voci",1);r.onupgradeneeded=()=>r.result.createObjectStore("clips");r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)})}
async function tx(mode,fn){const d=await idb();return new Promise((ok,ko)=>{const t=d.transaction("clips",mode);const r=fn(t.objectStore("clips"));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>ko(t.error)})}
async function loadClips(){try{for(const[k]of CLIPS){const v=await tx("readonly",st=>st.get(k));if(v)clips[k]=v}}catch(e){}}
const playUrl=u=>new Promise(r=>{const a=new Audio(u);a.onended=r;a.onerror=r;a.play().catch(r)});
const VOCI={sara:"Sara",nicola:"Nicola"};let voce=localStorage.getItem("centro_voce")||"sara";
const playDef=k=>new Promise(r=>{const a=new Audio(`audio/${voce}/${k}.mp3`);a.onended=()=>r(true);a.onerror=()=>r(false);a.play().catch(()=>r(false))});
async function say(k){const txt=(CLIPS.find(c=>c[0]===k)||[,""])[1];if(clips[k])return playUrl(clips[k]);if(await playDef(k))return;
  if("speechSynthesis"in window)return new Promise(r=>{const u=new SpeechSynthesisUtterance(txt);u.lang="it-IT";u.onend=r;u.onerror=r;speechSynthesis.speak(u);setTimeout(r,15000)})}

/* ================= VISTA PORTAVOCE (telefono) ================= */
let flow={},busy=false;
function P(h){$("#v-squadra").innerHTML=h}
function renderSquadra(){
  if(!G){P(`<p class="note">Collegamento al Centro…</p>`);return}
  if(!me||!G.teams[me.team]||G.teams[me.team].pin!==me.pin){me=null;localStorage.removeItem("centro_me");return flow.team?askPin():pickTeam()}
  if(flow.step)return;home()}
function pickTeam(){P(`<h2>Portavoce, identificatevi</h2><p class="note">Scegliete la vostra squadra.</p><div class="grid g2">${TEAMS.map(t=>`<button class="big" data-team="${t.id}">${t.id}</button>`).join("")}</div>`)}
function askPin(){P(`<div class="crumbs">${esc(flow.team)}</div><h2>Codice della squadra</h2><div class="pin">${[0,1,2,3].map(i=>`<span>${flow.pin&&flow.pin[i]?"•":""}</span>`).join("")}</div><div class="grid g3 keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="big" data-k="${n}">${n}</button>`).join("")}<button data-k="x">Indietro</button><button class="big" data-k="0">0</button><button data-k="b">⌫</button></div>${flow.bad?'<p class="err" style="text-align:center">Codice sbagliato.</p>':""}`)}
function myHints(){const out=[];for(const h of HEVS){const l=lvl(G,h,me.team);for(let i=0;i<l;i++)out.push(`<li><b>${h}</b> · indizio ${i+1}: ${esc(HINTS[h][i])}</li>`)}return out.join("")}
function home(){flow={};const T=G.teams[me.team];const mh=myHints();
  P(`<div class="crumbs">Collaborazione ${esc(me.team)}</div><h2>${esc(num(T.pts))} punti</h2>
  <div class="grid g2"><button class="big seg" data-go2="cons">Consegnare un evento</button><button class="big" data-go2="hint">Chiedere un indizio<br><small>costa 1 punto</small></button></div>
  <h3>I vostri indizi</h3>${mh?`<ul class="hints">${mh}</ul>`:'<p class="note">Nessun indizio chiesto finora. Gli indizi li vedete solo voi.</p>'}
  <p style="margin-top:18px"><button data-k="logout">Cambia squadra</button></p>`)}
function askEv(){flow.step="ev";const t=me.team;P(`<div class="crumbs">${esc(t)} · consegna</div><h2>Quale foglietto?</h2><p class="note">Per i gemelli scegliete EV-12 o EV-13: servono entrambe le metà.</p><div class="grid g4">${EVS.map(e=>{const s=G.ev[e];const off=closed(s,t,e)||s.failed.includes(t);return`<button class="pick ev" data-ev="${e}" ${off?"disabled":""}>${e}</button>`}).join("")}</div><p><button data-k="home">Annulla</button></p>`)}
function askVerdict(){P(`<div class="crumbs">${esc(me.team)} · ${esc(flow.ev)}</div><h2>Il vostro verdetto</h2><div class="grid g2"><button class="big seg" data-v="S">Candidato materia oscura</button><button class="big fon" data-v="F">Fondo</button></div><p><button data-k="home">Annulla</button></p>`)}
function askColp(){P(`<div class="crumbs">${esc(me.team)} · ${esc(flow.ev)} · fondo</div><h2>Chi è il colpevole?</h2><div class="grid g2">${COLP.map(c=>`<button class="big" data-c="${c}">${c}</button>`).join("")}</div><p><button data-k="home">Annulla</button></p>`)}
function confirmCons(){P(`<div class="crumbs">Riepilogo</div><h2>${esc(flow.ev)}</h2><p style="font-size:21px">Verdetto: <b>${flow.v==="S"?"candidato materia oscura":"fondo, "+esc(flow.c)}</b></p><p class="note">Il verdetto verrà annunciato ad alta voce al Centro di Analisi.</p><div class="grid g2"><button data-k="home">Annulla</button><button class="big" data-k="send">Consegna</button></div>`)}
function askHint(){flow.step="hint";const t=me.team,p=G.teams[t].pts;P(`<div class="crumbs">${esc(t)} · indizio</div><h2>Su quale foglietto?</h2><p class="note">Ogni indizio costa 1 punto e lo vedete solo voi. Per ogni foglietto ci sono due indizi, il secondo è più esplicito. Avete ${esc(num(p))} punti.</p>${p<1?'<p class="err">Non avete abbastanza punti per un indizio.</p>':""}<div class="grid g4">${HEVS.map(h=>{const l=lvl(G,h,t);const off=p<1||closed(G.ev[baseEv(h)],t,baseEv(h))||l>=2;return`<button class="pick ev" data-h="${h}" ${off?"disabled":""}>${h}${l?`<br><small>${l}/2</small>`:""}</button>`}).join("")}</div><p><button data-k="home">Annulla</button></p>`)}
function confirmHint(){const l=lvl(G,flow.h,me.team)+1;P(`<div class="crumbs">${esc(me.team)} · ${esc(flow.h)}</div><h2>Indizio ${l} di 2 su ${esc(flow.h)}</h2><p style="font-size:21px">Costa <b>1 punto</b>. Confermate?</p><div class="grid g2"><button data-k="home">No</button><button class="big" data-k="hok">Sì, dateci l'indizio</button></div>`)}
async function send(){if(busy)return;busy=true;P(`<div class="result"><div class="verdict" style="font-size:32px">Analisi in corso…</div></div>`);
  try{const f={...flow};const r=await store.transact(g=>judgeOn(fix(g),me.team,me.pin,f.ev,f.v,f.c));
    if(r.auth){me=null;localStorage.removeItem("centro_me");busy=false;flow={};return pickTeam()}
    store.announce({kind:"verdetto",team:me.team,ev:f.ev,clip:r.clip,sup:!!r.sup,msg:r.msg,pts:r.pts,bad:!!r.bad,bonus:!!r.bonus}).catch(()=>{});
    P(`<div class="result"><div class="crumbs">${esc(me.team)} · ${esc(f.ev)}</div>${r.bad?'<div class="stamp">RESPINTO</div>':""}<div class="verdict">${esc(r.msg)}</div><div class="pts">${esc(fmt(r.pts))} punti</div><div class="todo">${esc(r.todo)}</div><p style="margin-top:22px"><button class="big" data-k="home">Fatto</button></p></div>`)}
  catch(e){P(`<p class="err">Consegna non riuscita (${esc(e.code||e.message)}). Controllate la connessione e riprovate.</p><p><button class="big" data-k="home">Indietro</button></p>`)}
  busy=false;flow.step="res"}
async function getHint(){if(busy)return;busy=true;const h=flow.h;
  try{const r=await store.transact(g=>hintOn(g,me.team,me.pin,h));
    if(r.auth){me=null;localStorage.removeItem("centro_me");busy=false;flow={};return pickTeam()}
    if(r.no)P(`<p class="err" style="font-size:20px">${esc(r.no)}</p><p><button class="big" data-k="home">Indietro</button></p>`);
    else{store.announce({kind:"indizio",team:me.team,clip:"indizio"}).catch(()=>{});
      P(`<div class="result"><div class="crumbs">${esc(me.team)} · ${esc(h)} · indizio ${r.l} di 2</div><div class="verdict" style="font-size:clamp(26px,6vw,40px)">${esc(r.text)}</div><div class="pts">−1 punto</div><p class="note">Lo ritrovate nella pagina della squadra, sotto «I vostri indizi».</p><p style="margin-top:22px"><button class="big" data-k="home">Fatto</button></p></div>`)}}
  catch(e){P(`<p class="err">Richiesta non riuscita (${esc(e.code||e.message)}). Riprovate.</p><p><button class="big" data-k="home">Indietro</button></p>`)}
  busy=false;flow.step="res"}
function bindSquadra(){$("#v-squadra").addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b||busy)return;const d=b.dataset;
  if(d.team){flow={team:d.team,pin:""};return askPin()}
  if(d.go2){return d.go2==="hint"?askHint():askEv()}
  if(d.h){flow.h=d.h;flow.step="hint";return confirmHint()}
  if(d.ev){flow.ev=d.ev;flow.step="cons";return askVerdict()}
  if(d.v){flow.v=d.v;if(d.v==="S"){flow.c="";return confirmCons()}return askColp()}
  if(d.c){flow.c=d.c;return confirmCons()}
  const k=d.k;if(k===undefined)return;
  if(k==="home"){flow={};return home()}
  if(k==="send")return send();
  if(k==="hok")return getHint();
  if(k==="logout"){me=null;localStorage.removeItem("centro_me");flow={};return pickTeam()}
  if(k==="x"){flow={};return pickTeam()}
  if(k==="b"){flow.pin=flow.pin.slice(0,-1);flow.bad=0;return askPin()}
  flow.pin+=k;flow.bad=0;if(flow.pin.length<4)return askPin();
  if(G&&G.teams[flow.team].pin===flow.pin){me={team:flow.team,pin:flow.pin};localStorage.setItem("centro_me",JSON.stringify(me));flow={};return home()}
  flow.pin="";flow.bad=1;askPin()})}

/* ================= VISTA SCHERMO (computer con le casse) ================= */
let audioOn=false,queue=[],playing=false;
function renderSchermo(){$("#score").innerHTML=scoreHTML();$("#feed").innerHTML=feedHTML()}
async function playQueue(){if(playing)return;playing=true;
  while(queue.length){const a=queue.shift();const ov=$("#overlay");
    if(a.kind==="indizio")ov.innerHTML=`<div class="crumbs">${esc(a.team)}</div><div class="verdict">Richiesta di indizio</div><div class="pts">−1</div>`;
    else ov.innerHTML=`<div class="crumbs">${esc(a.team)} · ${esc(a.ev)}</div>${a.bad?'<div class="stamp">RESPINTO</div>':""}<div class="verdict">${a.sup?"SUPER-EVENTO<br>":""}${esc(a.msg)}</div><div class="pts">${esc(fmt(a.pts))}</div>`;
    ov.classList.remove("hide");
    if(audioOn){await say("team_"+a.team);if(a.sup)await say("super_attesa");await say(a.clip);if(a.bonus)await say("bonus")}
    await new Promise(r=>setTimeout(r,audioOn?2500:6000));ov.classList.add("hide")}
  playing=false}

/* ================= VISTA REGIA ================= */
let unlocked=false,resetArm=0;
function renderRegia(){const el=$("#v-regia");if(!G){el.innerHTML="<p class='note'>Collegamento…</p>";return}
  if(!unlocked){el.innerHTML=`<h2>Regia</h2><form id="lock" class="row"><input id="pw" type="password" placeholder="Password della regia" style="max-width:280px" aria-label="Password"><button>Entra</button></form><p class="note">La password iniziale è «regia»: cambiala qui dentro prima della festa.</p>`;return}
  el.innerHTML=`<h2>Regia</h2>
  <h3>Codici delle squadre</h3><div class="grid g4">${TEAMS.map(t=>`<label>${t.id}<input data-pin="${t.id}" inputmode="numeric" maxlength="4" value="${esc(G.teams[t.id].pin)}"></label>`).join("")}</div>
  <p class="row" style="margin-top:10px"><label style="flex:1;max-width:280px">Password regia<input id="newpw" value="${esc(G.admin)}"></label><button data-a="savecfg">Salva codici e password</button></p>
  <h3>Voci</h3><p class="row">Voce predefinita: ${Object.entries(VOCI).map(([k,n])=>`<button data-voce="${k}" ${k===voce?'class="seg"':""}>${n}</button>`).join("")}</p><p class="note">Se vuoi, sostituisci le frasi con la tua voce. Caricale da <b>questo computer</b>, quello collegato alle casse: restano salvate qui. Dove non c\'è una tua registrazione parla la voce predefinita.</p>
  <table><tbody>${CLIPS.map(([k,txt])=>`<tr><td>${esc(txt)}</td><td style="white-space:nowrap">${clips[k]?"✔ tua voce":"voce "+VOCI[voce]}</td><td class="row"><label class="btn">Carica<input type="file" accept="audio/*" data-up="${k}" class="hide"></label><button data-play="${k}">Ascolta</button>${clips[k]?`<button data-del="${k}">Togli</button>`:""}</td></tr>`).join("")}</tbody></table>
  <h3>Correzioni</h3><div class="grid g4">${TEAMS.map(t=>`<div class="row"><b style="flex:1">${t.id}</b><button data-adj="${t.id}" data-n="-1">−1</button><button data-adj="${t.id}" data-n="1">+1</button></div>`).join("")}</div>
  <p class="row" style="margin-top:10px"><button data-a="undo" ${G.log.length?"":"disabled"}>Annulla l'ultima operazione</button><button data-a="reset">Azzera la partita</button><span id="rmsg" class="note"></span></p>
  <h3>Eventi</h3><table><tbody>${EVS.map(e=>{const s=G.ev[e];return`<tr><td>${e}</td><td>${s.solved.length?"risolto da "+s.solved.map(q=>esc(q)+(q===s.first?" (primi)":"")).join(", "):"nessuno"}</td><td class="note">${s.failed.length?"sbagliato da "+s.failed.map(esc).join(", "):""}</td></tr>`}).join("")}</tbody></table>`}
function rmsg(t){const m=$("#rmsg");if(m)m.textContent=t}
function bindRegia(){const el=$("#v-regia");
  el.addEventListener("submit",e=>{e.preventDefault();if(G&&$("#pw").value===G.admin){unlocked=true;renderRegia()}else $("#pw").value=""});
  el.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
    if(d.play)say(d.play);
    if(d.voce){voce=d.voce;localStorage.setItem("centro_voce",voce);renderRegia();say("team_SENSEI")}
    if(d.del){delete clips[d.del];await tx("readwrite",st=>st.delete(d.del));renderRegia()}
    if(d.adj)await store.transact(g=>{g.teams[d.adj].pts=r1(g.teams[d.adj].pts+Number(d.n))});
    if(d.a==="savecfg"){const pins={};document.querySelectorAll("[data-pin]").forEach(i=>{if(/^\d{4}$/.test(i.value))pins[i.dataset.pin]=i.value});const pw=$("#newpw").value;
      await store.transact(g=>{Object.entries(pins).forEach(([t,p])=>g.teams[t].pin=p);if(pw)g.admin=pw});rmsg("Salvato.")}
    if(d.a==="undo")await store.transact(g=>{fix(g);const l=g.log.pop();if(!l)return;const x=g.teams[l.team],s=g.ev[l.ev];x.pts=r1(x.pts-l.pts);
      if(l.type==="hint"){x.ind--;g.hints[l.ev][l.team]--}else if(!l.ok&&l.pts<0){x.err--;s.failed=s.failed.filter(q=>q!==l.team)}else if(l.pts!==0){if(l.v==="S")x.seg--;else x.fon--;s.solved=s.solved.filter(q=>q!==l.team);if(s.first===l.team)s.first=null}});
    if(d.a==="reset"){if(Date.now()-resetArm>4000){resetArm=Date.now();rmsg("Premi di nuovo entro 4 secondi per azzerare tutto.");return}
      await store.transact(g=>{const n=fresh();TEAMS.forEach(t=>n.teams[t.id].pin=g.teams[t.id].pin);n.admin=g.admin;Object.keys(g).forEach(k=>delete g[k]);Object.assign(g,n)});rmsg("Partita azzerata.")}});
  el.addEventListener("change",async e=>{const k=e.target.dataset.up;if(!k||!e.target.files[0])return;const f=e.target.files[0];
    if(f.size>3e6){rmsg("File troppo grande: tieni la frase sotto i 20 secondi.");return}
    const url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
    try{clips[k]=url;await tx("readwrite",st=>st.put(url,k))}catch(er){rmsg("Non riesco a salvare la voce su questo computer.")}renderRegia()})}

/* ================= avvio ================= */
function route(){const v=view();["squadra","schermo","regia"].forEach(n=>$("#v-"+n).classList.toggle("hide",(v||"squadra")!==n));document.body.classList.toggle("tv",v==="schermo");
  if(v==="regia")renderRegia();if(v==="schermo")renderSchermo();if(!v||v==="squadra"){flow={};renderSquadra()}}
addEventListener("hashchange",route);
$("#audio").addEventListener("click",()=>{audioOn=true;$("#audio").classList.add("hide");$("#audiook").classList.remove("hide");if("speechSynthesis"in window)speechSynthesis.speak(new SpeechSynthesisUtterance(""))});
bindSquadra();bindRegia();route();loadClips();
(async()=>{try{store=await makeStore()}catch(e){setStatus("Firebase non raggiungibile: controlla la connessione.");return}
  setStatus(store.demo?"Modalità prova (dati solo su questo browser)":"Collegato al Centro");
  store.onState(g=>{if(!g){store.transact(()=>{}).catch(()=>{});return}G=fix(g);const v=view()||"squadra";
    if(v==="squadra"){if(!flow.step)renderSquadra()}else if(v==="schermo")renderSchermo();else if(v==="regia"&&!document.activeElement.matches("input"))renderRegia()});
  store.onAnnounce(a=>{if(view()==="schermo"){queue.push(a);playQueue()}})})();

</script>
